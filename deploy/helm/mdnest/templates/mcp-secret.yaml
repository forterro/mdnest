{{- if and .Values.mcp.enabled (not .Values.mcp.auth.existingSecret) .Values.mcp.auth.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mdnest.mcp.secretName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  token: {{ .Values.mcp.auth.token | quote }}
{{- end }}
